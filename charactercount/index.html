<body>

<div class="container">
  <h1>Character Counter</h1>

  <textarea id="input" placeholder="Type or paste your text here..."></textarea>

  <div class="limit-row">
    <label for="limit">Character limit:</label>
    <input type="number" id="limit" min="1" placeholder="none">
    <span id="limitStatus"></span>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="value" id="chars">0</span>
      <span class="label">Characters</span>
    </div>
    <div class="stat">
      <span class="value" id="charsNoSpace">0</span>
      <span class="label">No Spaces</span>
    </div>
    <div class="stat">
      <span class="value" id="words">0</span>
      <span class="label">Words</span>
    </div>
    <div class="stat">
      <span class="value" id="sentences">0</span>
      <span class="label">Sentences</span>
    </div>
    <div class="stat">
      <span class="value" id="paragraphs">0</span>
      <span class="label">Paragraphs</span>
    </div>
    <div class="stat">
      <span class="value" id="lines">0</span>
      <span class="label">Lines</span>
    </div>
    <div class="stat">
      <span class="value" id="readingTime">0s</span>
      <span class="label">Read Time</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn-copy" id="copyBtn">📋 Copy Text</button>
    <button class="btn-clear" id="clearBtn">🗑️ Clear</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const input = document.getElementById('input');
  const limitInput = document.getElementById('limit');
  const limitStatus = document.getElementById('limitStatus');

  const els = {
    chars: document.getElementById('chars'),
    charsNoSpace: document.getElementById('charsNoSpace'),
    words: document.getElementById('words'),
    sentences: document.getElementById('sentences'),
    paragraphs: document.getElementById('paragraphs'),
    lines: document.getElementById('lines'),
    readingTime: document.getElementById('readingTime'),
    charsStat: document.getElementById('chars').parentElement
  };

  function updateStats() {
    const text = input.value;

    // Characters (including spaces)
    const charCount = text.length;

    // Characters (excluding whitespace)
    const charNoSpace = text.replace(/\s/g, '').length;

    // Words: sequences of non-whitespace characters
    const wordCount = text.trim() === ''
      ? 0
      : text.trim().split(/\s+/).length;

    // Sentences: split on . ! ? followed by space/end
    const sentenceCount = text.trim() === ''
      ? 0
      : (text.match(/[^.!?]*[.!?]+(\s|$)/g) || []).filter(s => s.trim()).length;

    // Paragraphs: blocks separated by blank lines
    const paragraphCount = text.trim() === ''
      ? 0
      : text.trim().split(/\n\s*\n/).filter(p => p.trim()).length;

    // Lines
    const lineCount = text === '' ? 0 : text.split('\n').length;

    // Reading time (avg 200 words/min)
    const minutes = wordCount / 200;
    let readTime;
    if (wordCount === 0) readTime = '0s';
    else if (minutes < 1) readTime = Math.ceil(minutes * 60) + 's';
    else readTime = minutes.toFixed(1) + 'm';

    els.chars.textContent = charCount;
    els.charsNoSpace.textContent = charNoSpace;
    els.words.textContent = wordCount;
    els.sentences.textContent = sentenceCount;
    els.paragraphs.textContent = paragraphCount;
    els.lines.textContent = lineCount;
    els.readingTime.textContent = readTime;

    // Character limit feedback
    const limit = parseInt(limitInput.value, 10);
    if (!isNaN(limit) && limit > 0) {
      const remaining = limit - charCount;
      if (remaining < 0) {
        els.chars.classList.add('over-limit');
        limitStatus.textContent = `${Math.abs(remaining)} over limit`;
        limitStatus.className = 'over-limit';
      } else if (remaining <= limit * 0.1) {
        els.chars.classList.remove('over-limit');
        limitStatus.textContent = `${remaining} remaining`;
        limitStatus.className = 'warning';
      } else {
        els.chars.classList.remove('over-limit');
        limitStatus.textContent = `${remaining} remaining`;
        limitStatus.className = '';
      }
    } else {
      els.chars.classList.remove('over-limit');
      limitStatus.textContent = '';
    }
  }

  // Toast helper
  let toastTimer;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // Copy
  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!input.value) { showToast('Nothing to copy'); return; }
    try {
      await navigator.clipboard.writeText(input.value);
      showToast('Copied to clipboard!');
    } catch {
      input.select();
      document.execCommand('copy');
      showToast('Copied to clipboard!');
    }
  });

  // Clear
  document.getElementById('clearBtn').addEventListener('click', () => {
    input.value = '';
    updateStats();
    input.focus();
  });

  // Events
  input.addEventListener('input', updateStats);
  limitInput.addEventListener('input', updateStats);

  // Init
  updateStats();
</script>

</body>
