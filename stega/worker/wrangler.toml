name = "inkwhack-stega-live"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
PUBLIC_ORIGIN = "https://inkwhack.co.uk"

[[r2_buckets]]
binding = "LIVE_IMAGES"
bucket_name = "inkwhack-stega-live"

[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "31001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "31002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "31003"
simple = { limit = 120, period = 60 }

[[routes]]
pattern = "inkwhack.co.uk/stega/api/live*"
zone_name = "inkwhack.co.uk"

[[routes]]
pattern = "inkwhack.co.uk/stega/live/*"
zone_name = "inkwhack.co.uk"
